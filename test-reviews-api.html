<!DOCTYPE html>
<html>
<head>
    <title>Test Reviews API</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }
        button {
            background: #00bcd4;
            color: #000;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            margin: 10px 0;
        }
        .result {
            background: #333;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
            max-height: 400px;
            overflow-y: auto;
        }
        .error {
            color: #ff6b6b;
        }
        .success {
            color: #51cf66;
        }
    </style>
</head>
<body>
    <h1>Reviews API Tester</h1>
    
    <div>
        <label>Token: <input type="text" id="token" placeholder="Paste JWT token here" style="width: 500px;"></label>
    </div>

    <button onclick="testGetUserReviews()">Test GET /api/reviews/user</button>
    <button onclick="testGetReviewsByTitle()">Test GET /api/reviews/{title}</button>

    <div class="result" id="result"></div>

    <script>
        const API_BASE = 'http://localhost:8080';

        function log(message, isError = false) {
            const result = document.getElementById('result');
            const className = isError ? 'error' : 'success';
            result.innerHTML += `<div class="${className}">${message}</div>`;
            result.scrollTop = result.scrollHeight;
        }

        function clearLog() {
            document.getElementById('result').innerHTML = '';
        }

        async function testGetUserReviews() {
            clearLog();
            const token = document.getElementById('token').value;
            
            if (!token) {
                log('Token diperlukan!', true);
                return;
            }

            log('Fetching user reviews...');
            
            try {
                const response = await fetch(`${API_BASE}/api/reviews/user`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                log(`Status: ${response.status}`);

                const data = await response.json();
                log(JSON.stringify(data, null, 2));

                if (response.ok) {
                    log(`✓ Success! Found ${data.data?.length || 0} reviews`, false);
                } else {
                    log(`✗ Error: ${data.message}`, true);
                }
            } catch (error) {
                log(`✗ Request failed: ${error.message}`, true);
            }
        }

        async function testGetReviewsByTitle() {
            clearLog();
            const token = document.getElementById('token').value;
            const titleId = prompt('Enter title ID (e.g., tt0111161):');
            
            if (!titleId) return;

            log(`Fetching reviews for title: ${titleId}...`);
            
            try {
                const response = await fetch(`${API_BASE}/api/reviews/${titleId}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                log(`Status: ${response.status}`);

                const data = await response.json();
                log(JSON.stringify(data, null, 2));

                if (response.ok) {
                    log(`✓ Success! Found ${data.data?.length || 0} reviews`, false);
                } else {
                    log(`✗ Error: ${data.message}`, true);
                }
            } catch (error) {
                log(`✗ Request failed: ${error.message}`, true);
            }
        }

        log('Ready to test. Paste your JWT token and click buttons.');
    </script>
</body>
</html>
